<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IOAI Learning Platform</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- KaTeX for math -->
  <link rel="stylesheet" href="../lib/katex.min.css" />
  <!-- Highlight.js for code -->
  <link rel="stylesheet" href="../lib/highlight-atom-one-dark.min.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <div id="logo">
          <span class="logo-icon">◆</span>
          <span class="logo-text">IOAI Platform</span>
        </div>
        <div id="streak-badge" title="Daily streak"></div>
      </div>
      <nav id="track-nav"></nav>
      <div id="sidebar-footer">
        <div id="overall-progress">
          <span class="progress-label">Overall progress</span>
          <div class="progress-bar-wrap"><div class="progress-bar-fill" id="overall-bar"></div></div>
          <span class="progress-pct" id="overall-pct">0%</span>
        </div>
      </div>
    </aside>

    <!-- Main area -->
    <main id="main">
      <div id="topbar">
        <button id="btn-roadmap" class="tab-btn active" data-view="roadmap">Roadmap</button>
        <button id="btn-lesson" class="tab-btn" data-view="lesson" style="display:none">Lesson</button>
        <div id="topbar-right">
          <span id="xp-display">0 XP</span>
        </div>
      </div>

      <div id="view-roadmap" class="view active"></div>
      <div id="view-lesson" class="view"></div>
    </main>
  </div>

  <script src="../lib/marked.min.js"></script>
  <script src="../lib/highlight.min.js"></script>
  <script src="../lib/katex.min.js"></script>
  <script src="../lib/auto-render.min.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
